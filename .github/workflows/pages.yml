name: Deploy the Fenumion Codex to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages package
        run: |
          mkdir -p "$RUNNER_TEMP/fenumion-pages"
          rsync -a --exclude "/assets/music/" site/ "$RUNNER_TEMP/fenumion-pages/"
          python3 -c "from pathlib import Path; p=Path('$RUNNER_TEMP/fenumion-pages'); size=sum(f.stat().st_size for f in p.rglob('*') if f.is_file()); print(f'Pages package: {size:,} bytes'); assert size < 1_000_000_000, 'Pages package exceeds 1 GB'"
      - name: Upload the static Codex
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/fenumion-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

